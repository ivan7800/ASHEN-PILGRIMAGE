name: Quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify release manifest
        run: sha256sum -c MANIFIESTO-SHA256-v4.0-RC.txt

      - name: Run complete automated QA
        run: ./VERIFICAR-LINUX.sh
