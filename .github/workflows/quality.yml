name: Quality
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run JavaScript suites
        run: |
          if compgen -G 'test-*.mjs' > /dev/null; then for f in test-*.mjs; do node "$f" || exit 1; done; else echo 'No suites yet'; fi
